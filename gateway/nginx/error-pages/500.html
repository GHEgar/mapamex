<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio temporalmente no disponible</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #FFFFFF 0%, #F7F0FA 100%);
            color: #2E4372;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .illustration {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: #2E4372;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a6a8a;
            margin-bottom: 2rem;
            max-width: 440px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            align-items: center;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2.5rem;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: #703089;
            color: #fff;
        }

        .btn-primary:hover {
            background: #5C2472;
            box-shadow: 0 6px 6px rgba(92, 36, 114, 0.2);
        }

        .btn-secondary {
            background: transparent;
            color: #703089;
            border: 1.5px solid #703089;
        }

        .btn-secondary:hover {
            background: #703089;
            color: #fff;
        }

        @media (min-width: 480px) {
            .actions {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="#F0E6F6" />
            <rect x="60" y="55" width="80" height="60" rx="6" fill="#703089" />
            <rect x="65" y="60" width="70" height="40" rx="3" fill="#E8D5F0" />
            <circle cx="85" cy="78" r="4" fill="#703089" opacity="0.6">
                <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="100" cy="78" r="4" fill="#703089" opacity="0.8">
                <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
            </circle>
            <circle cx="115" cy="78" r="4" fill="#703089" opacity="0.6">
                <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" begin="0.6s" repeatCount="indefinite" />
            </circle>
            <rect x="75" y="105" width="20" height="3" rx="1.5" fill="#703089" opacity="0.3" />
            <rect x="75" y="111" width="50" height="3" rx="1.5" fill="#703089" opacity="0.3" />
            <circle cx="155" cy="50" r="8" fill="#E8D5F0" />
            <circle cx="45" cy="140" r="6" fill="#E8D5F0" />
            <circle cx="160" cy="150" r="10" fill="#F0E6F6" />
            <path d="M88 140 L100 160 L112 140" stroke="#703089" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.3">
                <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" />
            </path>
        </svg>
        <h1>Estamos trabajando<br>en ello</h1>
        <p>Nuestros servidores están experimentando alta demanda en este momento. Estamos atendiendo la situación. Por favor, intenta de nuevo en unos momentos.</p>
        <div class="actions">
            <button class="btn btn-primary" onclick="window.location.reload()">Reintentar</button>
            <a href="/" class="btn btn-secondary">Ir al inicio</a>
        </div>
    </div>
</body>
</html>
