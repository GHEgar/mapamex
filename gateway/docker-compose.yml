name: gateway

services:
  nginx:
    image: ${GATEWAY_NGINX_IMAGE:-gateway-nginx:local}
    build:
      context: .
      additional_contexts:
        visor: ../visor
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_BACKEND_API_HOST: ${VITE_BACKEND_API_HOST:-/visor/api/}
        VITE_GEOSERVER_URL: ${VITE_GEOSERVER_URL:-/geoserver/}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_STORAGE_ORIGIN: ${VITE_STORAGE_ORIGIN:-}
    env_file:
      - .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${SSL_VOLUME_PATH}
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY}
      PORTAL_HOST: ${PORTAL_HOST}
      VISOR_BACKEND_HOST: ${VISOR_BACKEND_HOST}
      VISOR_MCP_HOST: ${VISOR_MCP_HOST}
      STORAGE_HOST: ${STORAGE_HOST}
      CMS_HOST: ${CMS_HOST}
      GEOSERVER_HOST: ${GEOSERVER_HOST}
      GTM_ID: ${GTM_ID}
      SEO_ENABLED: ${SEO_ENABLED}
      REAL_IP_FROM: ${REAL_IP_FROM}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - mapamex-network
    restart: unless-stopped

networks:
  mapamex-network:
    external: true
