name: storage

services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.23}
    container_name: storage-seaweedfs
    user: "seaweed:seaweed"
    entrypoint: ["/bin/sh", "/seaweedfs-entrypoint.sh"]
    command:
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/identities.json
      - -s3.port=8333
      - -metricsPort=9091
      - -ip.bind=0.0.0.0
      - -volume.max=100
    ports:
      - "${STORAGE_BIND_ADDRESS:-127.0.0.1}:${STORAGE_S3_PORT:-8333}:8333"
    environment:
      WEED_LEVELDB2_ENABLED: "true"
    volumes:
      - seaweedfs_data:/data
      - ./config:/etc/seaweedfs:ro
      - ./scripts/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status | grep -q IsLeader"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - storage_network
      - mapamex-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  storage-init:
    profiles: ["init"]
    image: alpine:3.20
    container_name: storage-init
    entrypoint: ["/bin/sh", "/scripts/init-seaweedfs.sh"]
    volumes:
      - ./scripts/init-seaweedfs.sh:/scripts/init-seaweedfs.sh:ro
      - ./config:/etc/seaweedfs
    environment:
      STORAGE_BUCKETS: "${STORAGE_BUCKETS:?STORAGE_BUCKETS is required}"
      STORAGE_PUBLIC_BUCKETS: "${STORAGE_PUBLIC_BUCKETS:-visor mapamex}"
      STORAGE_ADMIN_ACCESS_KEY: "${STORAGE_ADMIN_ACCESS_KEY:?STORAGE_ADMIN_ACCESS_KEY is required}"
      STORAGE_ADMIN_SECRET_KEY: "${STORAGE_ADMIN_SECRET_KEY:?STORAGE_ADMIN_SECRET_KEY is required}"
      ROTATE_FLAG: "${ROTATE_FLAG:-0}"
      TARGET_BUCKET: "${TARGET_BUCKET:-}"
    restart: "no"

volumes:
  seaweedfs_data:

networks:
  storage_network:
    driver: bridge
  mapamex-network:
    external: true
