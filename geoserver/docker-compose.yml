services:
  geoserver:
    image: kartoza/geoserver:2.27.0
    container_name: geoserver
    restart: always
    ports:
      - "${GEOSERVER_BIND_ADDRESS:-127.0.0.1}:${GEOSERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      RESET_ADMIN_CREDENTIALS: ${RESET_ADMIN_CREDENTIALS}
      GEOSERVER_DATA_DIR: ${GEOSERVER_DATA_DIR}
      ENABLE_JSONP: ${ENABLE_JSONP}
      MAX_FILTER_RULES: ${MAX_FILTER_RULES}
      OPTIMIZE_LINE_WIDTH: ${OPTIMIZE_LINE_WIDTH}
      GEOSERVER_PROXY_BASE_URL: ${GEOSERVER_PROXY_BASE_URL}
      GEOSERVER_CSRF_WHITELIST: ${GEOSERVER_CSRF_WHITELIST}
      HTTP_SCHEME: ${HTTP_SCHEME}
      TOMCAT_SECURE: ${TOMCAT_SECURE}
      INITIAL_MEMORY: ${INITIAL_MEMORY:-2G}
      MAXIMUM_MEMORY: ${MAXIMUM_MEMORY:-4G}
      ADDITIONAL_JAVA_STARTUP_OPTIONS: ${ADDITIONAL_JAVA_STARTUP_OPTIONS:-}
      GEOSERVER_XSTREAM_WHITELIST: ${GEOSERVER_XSTREAM_WHITELIST}
      POSTGIS_HOST: ${POSTGIS_HOST}
      POSTGIS_PORT: ${POSTGIS_PORT}
      POSTGIS_DB: ${POSTGIS_DB}
      POSTGIS_USER: ${POSTGIS_USER}
      POSTGIS_PASSWORD: ${POSTGIS_PASSWORD}
      GS_CONTROLFLOW_TIMEOUT: ${GS_CONTROLFLOW_TIMEOUT}
      GS_CONTROLFLOW_OWS_GLOBAL: ${GS_CONTROLFLOW_OWS_GLOBAL}
      GS_CONTROLFLOW_OWS_WMS_GETMAP: ${GS_CONTROLFLOW_OWS_WMS_GETMAP}
      GS_CONTROLFLOW_OWS_WFS_MSEXCEL: ${GS_CONTROLFLOW_OWS_WFS_MSEXCEL}
      GS_CONTROLFLOW_OWS_GWC: ${GS_CONTROLFLOW_OWS_GWC}
      GS_CONTROLFLOW_USER: ${GS_CONTROLFLOW_USER}
      GS_CONTROLFLOW_USER_WPS_EXECUTE: ${GS_CONTROLFLOW_USER_WPS_EXECUTE}
      GS_CONTROLFLOW_USER_WMS_GETMAP: ${GS_CONTROLFLOW_USER_WMS_GETMAP}
      GS_CONTROLFLOW_IP: ${GS_CONTROLFLOW_IP}
    entrypoint: /opt/geoserver/scripts/entrypoint-wrapper.sh
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - ./plugins/gs-geopkg-output-core-2.27.0.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gs-geopkg-output-core-2.27.0.jar:ro
      - ./plugins/gs-geopkg-output-wfs-2.27.0.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gs-geopkg-output-wfs-2.27.0.jar:ro
      - ./plugins/gs-geopkg-output-wms-2.27.0.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gs-geopkg-output-wms-2.27.0.jar:ro
      - ./plugins/gs-wps-download-2.27.0.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/gs-wps-download-2.27.0.jar:ro
      - ./plugins/jcodec-0.2.3.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/jcodec-0.2.3.jar:ro
      - ./plugins/jcodec-javase-0.2.3.jar:/usr/local/tomcat/webapps/geoserver/WEB-INF/lib/jcodec-javase-0.2.3.jar:ro
      - ./server.xml.template:/opt/geoserver/server.xml.template:ro
      - ./scripts/entrypoint-wrapper.sh:/opt/geoserver/scripts/entrypoint-wrapper.sh:ro
      - ./config/global.xml.template:/opt/geoserver/global.xml.template:ro
      - ./config/controlflow.properties.template:/opt/geoserver/controlflow.properties.template:ro
      - ./config/wms.xml:/opt/geoserver/data_dir/wms.xml:ro
      - ./config/wfs.xml:/opt/geoserver/data_dir/wfs.xml:ro
      - ./config/security/csp.xml:/opt/geoserver/data_dir/security/csp.xml:ro
      - ./fonts:/usr/share/fonts/custom:ro
    networks:
      - geonetwork
      - database-network
      - mapamex-network

  gwc-seeder:
    image: alpine/curl:8.12.1
    container_name: geoserver-gwc-seeder
    restart: always
    environment:
      GEOSERVER_URL: ${GWC_SEEDER_GEOSERVER_URL}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SEED_LAYERS: ${GWC_SEED_LAYERS}
      SEED_THREADS: ${GWC_SEED_THREADS}
      SEED_BOUNDS: ${GWC_SEED_BOUNDS}
      SEED_EXPIRE_CLIENTS: ${GWC_SEED_EXPIRE_CLIENTS}
      SEED_LAYERS_FILE: /seed/seed-layers.txt
      SEED_STATUS_FILE: /tmp/seed-status
    entrypoint: ["/bin/sh", "-c", "cp /seed/seeder-crontab /etc/crontabs/root && /bin/sh /seed/seed-cache.sh; exec crond -f -l 8"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q '^ok$' /tmp/seed-status 2>/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m
    volumes:
      - ./scripts/seed-cache.sh:/seed/seed-cache.sh:ro
      - ./config/seeder-crontab:/seed/seeder-crontab:ro
      - ./config/seed-layers.txt:/seed/seed-layers.txt:ro
    depends_on:
      - geoserver
    networks:
      - geonetwork

volumes:
  geoserver_data:

networks:
  geonetwork:
    driver: bridge
  database-network:
    external: true
  mapamex-network:
    external: true
