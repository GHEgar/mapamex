name: CD

# Deploy por artefactos: el servidor NO clona el repo ni compila. Recibe solo los
# compose + Makefile, verifica la firma cosign de cada imagen y hace pull.
# Requiere secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, PROJECT_PATH, GHCR_TOKEN.
# Los digests a desplegar salen del workflow Release. Ver mapamex-docs/RUNBOOK-DEPLOY.md.

on:
  workflow_dispatch:
    inputs:
      images_env:
        description: 'Contenido de .env.images (VAR=ghcr.io/...@sha256:...) — uno por linea'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: sigstore/cosign-installer@v3

      - name: Verificar firmas antes de desplegar
        run: |
          echo "${{ inputs.images_env }}" | grep -oE 'ghcr\.io/[^[:space:]]+@sha256:[a-f0-9]+' | sort -u | while read -r img; do
            echo "Verificando $img"
            cosign verify "$img" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              > /dev/null
          done

      - name: Enviar compose y Makefile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*/docker-compose.yml,Makefile,mk/*"
          target: ${{ secrets.PROJECT_PATH }}

      - name: Pull y arranque
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          envs: GHCR_TOKEN
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            cat > .env.images <<'IMAGES'
            ${{ inputs.images_env }}
            IMAGES
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            set -a; . ./.env.images; set +a
            make ecosystem-deploy
            docker logout ghcr.io
            docker image prune -f --filter "until=168h"
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          UA="Mozilla/5.0 (compatible; MapaMex-HealthCheck/1.0)"
          for i in $(seq 1 10); do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" -A "$UA" https://visor-mapamex.app || true)
            if [ "$STATUS" = "200" ]; then
              echo "OK ($STATUS)"; exit 0
            fi
            echo "Intento $i: $STATUS; reintentando en 15s..."; sleep 15
          done
          echo "Health check fallo"; exit 1
