name: cms

services:
  nginx:
    image: ${CMS_NGINX_IMAGE:-cms-nginx:local}
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-/api/administrador}
        VITE_WEB_URL: ${PUBLIC_ORIGIN:-}
        BUILD_STATS: ${BUILD_STATS:-}
    container_name: cms-nginx
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cms_network
      - mapamex-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    networks:
      - cms_network
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    image: ${CMS_API_IMAGE:-cms-api:local}
    container_name: cms-api
    command: ./scripts/start_backend.sh
    secrets:
      - cms_env
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CMS_ENV_FILE: /run/secrets/cms_env
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
      # Host público derivado de PUBLIC_ORIGIN (cms/.env.production). Va aquí
      # (no en el env montado) porque environment: SÍ interpola ${VAR} y tiene prioridad.
      CORS_ORIGINS: '["${PUBLIC_ORIGIN:?}"]'
      GEOSERVER_URL: ${PUBLIC_ORIGIN:?}/geoserver/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cms_network
      - mapamex-network
      - database-network
    restart: unless-stopped

  cron-jobs:
    image: ${CMS_API_IMAGE:-cms-api:local}
    container_name: cms-cron-jobs
    command:
      - sh
      - -c
      - |
        while true; do
          echo "[cron-jobs] $$(date -u +%Y-%m-%dT%H:%M:%SZ) running purge_visor_accesos"
          python scripts/purge_visor_accesos.py || echo "[cron-jobs] purge visor fallo, continuando"
          echo "[cron-jobs] $$(date -u +%Y-%m-%dT%H:%M:%SZ) running refresh_visor_stats"
          python scripts/refresh_visor_stats.py || echo "[cron-jobs] refresh stats fallo, continuando"
          sleep ${CRON_INTERVAL:-3600}
        done
    secrets:
      - cms_env
    volumes:
      - ./api:/app
    depends_on:
      api:
        condition: service_started
    environment:
      CMS_ENV_FILE: /run/secrets/cms_env
      GEOSERVER_URL: ${PUBLIC_ORIGIN:?}/geoserver/
      CORS_ORIGINS: '["${PUBLIC_ORIGIN:?}"]'
    networks:
      - cms_network
      - database-network
    restart: unless-stopped

volumes:
  redis_data:

secrets:
  cms_env:
    file: ${API_ENV_FILE:-./.env.production}

networks:
  cms_network:
    driver: bridge
  mapamex-network:
    external: true
  database-network:
    external: true
