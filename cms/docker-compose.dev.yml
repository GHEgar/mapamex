name: cms-dev

services:
  postgres:
    build:
      dockerfile_inline: |
        FROM postgres:18-alpine
    image: cms-postgres-dev
    container_name: cms-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cms_network_dev

  redis:
    build:
      dockerfile_inline: |
        FROM redis:8-alpine
    image: cms-redis-dev
    container_name: cms-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s
    networks:
      - cms_network_dev

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    image: cms-api-dev
    container_name: cms-api-dev
    command: ./scripts/start_backend.sh
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - ./.env.development
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT}
      STORAGE_USE_SSL: ${STORAGE_USE_SSL:-false}
      STORAGE_VERIFY_SSL: ${STORAGE_VERIFY_SSL:-true}
    networks:
      - cms_network_dev
      - database-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    image: cms-admin-dev
    container_name: cms-admin-dev
    working_dir: /app
    ports:
      - "${ADMIN_PORT:-3011}:3011"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    env_file:
      - ./.env.development
    environment:
      - VITE_PORT=3011
      - VITE_GOOGLE_ANALYTICS_ID=${VITE_GOOGLE_ANALYTICS_ID}
      - VITE_VISOR_PROXY_URL=${VITE_VISOR_PROXY_URL:-http://visor-dev-frontend-1:3006}
    networks:
      - cms_network_dev
      - visor-network

volumes:
  postgres_data_dev:
  redis_data_dev:
  admin_node_modules:


networks:
  cms_network_dev:
    driver: bridge
  visor-network:
    external: true
  database-network:
    external: true
